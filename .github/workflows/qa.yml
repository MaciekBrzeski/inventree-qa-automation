name: QA suite

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      inventree_docker_ref:
        description: 'Branch / tag / SHA of inventree-qa-docker to boot'
        required: false
        default: main
  repository_dispatch:
    types: [docker-updated]

env:
  INVENTREE_DOCKER_REPO: MaciekBrzeski/inventree-qa-docker

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Resolve inventree-qa-docker ref
        id: ref
        run: |
          REF="${{ github.event.inputs.inventree_docker_ref }}"
          if [[ -z "$REF" ]]; then
            REF="${{ github.event.client_payload.ref }}"
          fi
          if [[ -z "$REF" ]]; then
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout inventree-qa-docker (${{ steps.ref.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INVENTREE_DOCKER_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          path: inventree-qa-docker

      - name: Map inventree.localhost to 127.0.0.1
        run: echo "127.0.0.1 inventree.localhost" | sudo tee -a /etc/hosts

      - name: Boot InvenTree stack + restore seed
        working-directory: inventree-qa-docker
        run: ./setup.sh

      - name: Wait for /api/ to become healthy
        run: |
          for i in {1..90}; do
            if curl -sf http://inventree.localhost/api/ > /dev/null 2>&1; then
              echo "InvenTree up after ${i}s"
              curl -s http://inventree.localhost/api/ | head -c 400
              echo
              exit 0
            fi
            sleep 2
          done
          echo "InvenTree did not come up in 180s" >&2
          docker compose -f inventree-qa-docker/docker-compose.yml logs --tail=100 || true
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API suite deps
        working-directory: automation/api
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run API suite
        working-directory: automation/api
        run: npx playwright test --reporter=list

      - name: Install UI suite deps
        working-directory: automation/ui
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: automation/ui
        run: npx playwright install --with-deps chromium

      - name: Run UI suite
        working-directory: automation/ui
        run: npx playwright test --reporter=list

      # ── Visual regression flow ───────────────────────────────────────────
      # On `main` push: capture fresh baselines in this runner env and upload
      #                 as `baseline-main` artefact (90d retention).
      # Otherwise:      download the latest `baseline-main` from main, run
      #                 compare against it, fail PRs on real visual drift.

      - name: Is this a main-branch push?
        id: branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture baselines (main only)
        if: steps.branch.outputs.is_main == 'true'
        working-directory: automation/ui
        run: |
          rm -rf baseline
          CHECKPOINT_MODE=capture npx playwright test \
            tests/0-baseline-seeded.spec.ts \
            tests/a-parts-category-create.spec.ts \
            tests/h-parts-bom-ui.spec.ts \
            tests/k-parts-pricing-ui.spec.ts \
            --reporter=list

      - name: Upload main baseline artefact
        if: steps.branch.outputs.is_main == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-main
          path: |
            automation/ui/baseline/**/*.png
            automation/ui/baseline/**/*.html
            automation/ui/baseline/**/*.requests.json
            !automation/ui/baseline/**/*.actual.*
            !automation/ui/baseline/**/*.diff.*
            !automation/ui/baseline/report.html
            !automation/ui/baseline/reports/**
          if-no-files-found: error
          retention-days: 90

      - name: Download latest main baseline
        if: steps.branch.outputs.is_main != 'true'
        id: dl
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow qa.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId -q '.[0].databaseId')
          if [[ -z "$RUN_ID" ]]; then
            echo "::warning::no successful main run yet — baseline compare will be skipped"
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading baseline-main from run $RUN_ID"
          mkdir -p automation/ui/baseline
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name baseline-main \
            --dir automation/ui/baseline
          echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          find automation/ui/baseline -type f | wc -l

      - name: Checkpoint baseline compare vs main
        if: steps.branch.outputs.is_main != 'true' && steps.dl.outputs.has_baseline == 'true'
        id: compare
        working-directory: automation/ui
        run: |
          CHECKPOINT_MODE=compare npx playwright test \
            tests/0-baseline-seeded.spec.ts \
            tests/a-parts-category-create.spec.ts \
            tests/h-parts-bom-ui.spec.ts \
            tests/k-parts-pricing-ui.spec.ts \
            --reporter=list

      - name: Build diff report
        if: always() && steps.compare.outcome == 'failure'
        working-directory: automation/ui
        run: npx tsx scripts/build-diff-report.ts || true

      - name: Upload diff report on regression
        if: always() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-diff-${{ github.run_id }}
          path: |
            automation/ui/baseline/report.html
            automation/ui/baseline/**/*.actual.*
            automation/ui/baseline/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-${{ github.run_id }}
          path: |
            automation/ui/test-results/
            automation/api/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd inventree-qa-docker
          docker compose logs --tail=200 inventree-server || true
          docker compose logs --tail=100 inventree-worker || true
          docker compose logs --tail=50 inventree-db || true
