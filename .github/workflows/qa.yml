name: QA suite

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      inventree_docker_ref:
        description: 'Branch / tag / SHA of inventree-qa-docker to boot'
        required: false
        default: main
  repository_dispatch:
    types: [docker-updated]

env:
  INVENTREE_DOCKER_REPO: MaciekBrzeski/inventree-qa-docker

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Resolve inventree-qa-docker ref
        id: ref
        run: |
          REF="${{ github.event.inputs.inventree_docker_ref }}"
          if [[ -z "$REF" ]]; then
            REF="${{ github.event.client_payload.ref }}"
          fi
          if [[ -z "$REF" ]]; then
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout inventree-qa-docker (${{ steps.ref.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INVENTREE_DOCKER_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          path: inventree-qa-docker

      - name: Map inventree.localhost to 127.0.0.1
        run: echo "127.0.0.1 inventree.localhost" | sudo tee -a /etc/hosts

      - name: Boot InvenTree stack + restore seed
        working-directory: inventree-qa-docker
        run: ./setup.sh

      - name: Wait for /api/ to become healthy
        run: |
          for i in {1..90}; do
            if curl -sf http://inventree.localhost/api/ > /dev/null 2>&1; then
              echo "InvenTree up after ${i}s"
              curl -s http://inventree.localhost/api/ | head -c 400
              echo
              exit 0
            fi
            sleep 2
          done
          echo "InvenTree did not come up in 180s" >&2
          docker compose -f inventree-qa-docker/docker-compose.yml logs --tail=100 || true
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API suite deps
        working-directory: automation/api
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run API suite
        working-directory: automation/api
        run: npx playwright test --reporter=list

      - name: Install UI suite deps
        working-directory: automation/ui
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: automation/ui
        run: npx playwright install --with-deps chromium

      - name: Run UI suite
        working-directory: automation/ui
        run: npx playwright test --reporter=list

      - name: Checkpoint baseline compare
        working-directory: automation/ui
        run: |
          CHECKPOINT_MODE=compare npx playwright test \
            tests/a-parts-category-create.spec.ts \
            tests/h-parts-bom-ui.spec.ts \
            tests/k-parts-pricing-ui.spec.ts \
            --reporter=list

      - name: Build diff report on failure
        if: failure()
        working-directory: automation/ui
        run: npx tsx scripts/build-diff-report.ts || true

      - name: Upload baseline report + artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-${{ github.run_id }}
          path: |
            automation/ui/baseline/report.html
            automation/ui/baseline/**/*.actual.*
            automation/ui/baseline/**/*.diff.png
            automation/ui/test-results/
            automation/api/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd inventree-qa-docker
          docker compose logs --tail=200 inventree-server || true
          docker compose logs --tail=100 inventree-worker || true
          docker compose logs --tail=50 inventree-db || true
